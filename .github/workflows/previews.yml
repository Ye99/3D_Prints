name: Render model previews

# Renders a PNG preview for every .stl and .3mf file into previews/ and
# commits any new, changed or removed previews back to master.
on:
  push:
    branches: [master]
    paths:
      - "**/*.stl"
      - "**/*.STL"
      - "**/*.3mf"
      - "**/*.3MF"
      - "tools/render_previews.py"
      - "tools/requirements.txt"
      - ".github/workflows/previews.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-render every preview"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: render-previews
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Render previews
        run: python tools/render_previews.py ${{ inputs.force && '--force' || '' }}

      - name: Commit previews
        # Commit the previews that did render, even if some models failed.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A previews
          if git diff --cached --quiet; then
            echo "Previews are up to date."
          else
            git commit -m "Update model previews"
            git push
          fi
